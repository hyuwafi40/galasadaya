{% load static %}
<section class="min-h-[70vh] flex items-center relative mb-32 pt-10">
    {% with featured=articles|first %}
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center w-full">
            <div class="lg:col-span-5 relative z-20 order-2 lg:order-1 glass-panel p-8 md:p-12 transform lg:translate-x-12 lg:translate-y-8 bg-white/40 border-l-4 border-l-neon-pink shadow-2xl backdrop-blur-xl">
                <div class="inline-block bg-gray-900 text-white text-xs font-black px-4 py-1.5 rounded-full mb-6 transform -rotate-2">LATEST EVENT</div>
                <h1 class="text-5xl sm:text-6xl font-black text-gray-900 leading-[1.1] mb-6 uppercase tracking-tighter">
                    <span class="text-neon-pink block mb-2">Feel The</span>
                    Frequency
                </h1>
                <p class="font-semibold text-gray-700 mb-8 text-lg leading-relaxed">{{ featured.excerpt|default:featured.content|striptags|truncatechars:180 }}</p>
                <a href="{% url 'blog:article' featured.slug %}"
                   class="glass-btn px-8 py-4 rounded-full font-black uppercase tracking-widest inline-flex items-center gap-3 w-full sm:w-auto justify-center">
                    Masuk ke Galeri <i class="fas fa-bolt"></i>
                </a>
            </div>
            <div class="lg:col-span-8 relative z-10 order-1 lg:order-2">
                <div class="relative rounded-[2rem] sm:rounded-[3rem] overflow-hidden shadow-2xl aspect-[4/3] lg:aspect-video transform lg:-rotate-2 border-4 border-white/50">
                    <img src="{{ featured.thumbnail }}"
                         class="w-full h-full object-cover"
                         alt="Hero">
                    <div class="absolute inset-0 bg-gradient-to-r from-neon-violet/30 to-transparent mix-blend-overlay"></div>
                    <div class="absolute bottom-6 right-6 glass-pill px-6 py-3 bg-white/20">
                        <span class="font-black text-white text-xl drop-shadow-md">{{ featured.category.name|default:"Featured"|upper }}</span>
                    </div>
                </div>
                <div class="hidden lg:block absolute -bottom-10 -left-10 w-40 h-40 bg-neon-cyan rounded-full mix-blend-multiply filter blur-2xl animate-pulse">
                </div>
            </div>
        </div>
    {% endwith %}
</section>

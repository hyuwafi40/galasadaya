{% load static %}
<section class="grid grid-cols-1 sm:grid-cols-3 gap-5">
    <div class="glass-panel p-6 rounded-[2rem] flex items-center gap-5">
        <div class="w-14 h-14 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-2xl">
            <i class="fa-solid fa-users"></i>
        </div>
        <div>
            <p class="text-sm font-semibold text-slate-500">Total Users</p>
            <p class="text-3xl font-extrabold text-slate-800">{{ total_users }}</p>
        </div>
    </div>
    <div class="glass-panel p-6 rounded-[2rem] flex items-center gap-5">
        <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl">
            <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
            <p class="text-sm font-semibold text-slate-500">Staff</p>
            <p class="text-3xl font-extrabold text-slate-800">{{ total_staff }}</p>
        </div>
    </div>
    <div class="glass-panel p-6 rounded-[2rem] flex items-center gap-5">
        <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-2xl">
            <i class="fa-solid fa-crown"></i>
        </div>
        <div>
            <p class="text-sm font-semibold text-slate-500">Superuser</p>
            <p class="text-3xl font-extrabold text-slate-800">{{ total_superuser }}</p>
        </div>
    </div>
</section>

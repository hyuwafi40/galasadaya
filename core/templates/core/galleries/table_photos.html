<div id="photosTable">
    <div class="glass-panel rounded-[2rem] p-6">
        <div class="overflow-x-auto hide-scroll rounded-2xl border border-white/60 bg-white/20">
            <table class="w-full text-left border-collapse min-w-[700px]">
                <thead>
                    <tr class="bg-white/40 border-b border-white/60 text-xs text-slate-500 uppercase tracking-widest font-bold">
                        <th class="px-5 py-4 w-16">No</th>
                        <th class="px-5 py-4">Foto</th>
                        <th class="px-5 py-4">Caption</th>
                        <th class="px-5 py-4">Aksi</th>
                    </tr>
                </thead>
                <tbody class="text-sm divide-y divide-white/40 text-slate-600 font-medium">
                    {% for photo in photos %}
                        <tr class="hover:bg-white/40 transition-colors group">
                            <td class="px-5 py-3.5">{{ forloop.counter }}</td>
                            <td class="px-5 py-3.5">
                                <img src="{{ photo.image }}"
                                     alt="{{ photo.caption }}"
                                     class="w-12 h-12 rounded-xl object-cover shadow-sm">
                            </td>
                            <td class="px-5 py-3.5">{{ photo.caption|default:"-" }}</td>
                            <td class="px-5 py-3.5">
                                <div class="flex items-center gap-2">
                                    <a href="{% url 'core:galleries_photo_update' photo.pk %}"
                                       class="w-8 h-8 rounded-xl bg-white/60 text-slate-500 hover:text-indigo-600 hover:bg-white transition-all shadow-sm btn-press flex items-center justify-center">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </a>
                                    {% if request.user.is_superuser or photo.created_by_id == request.user.id %}
                                        <button data-modal-open
                                                data-url="{% url 'core:galleries_photo_delete' photo.pk %}"
                                                class="w-8 h-8 rounded-xl bg-white/60 text-rose-500 hover:text-rose-600 hover:bg-white transition-all shadow-sm btn-press">
                                            <i class="fa-solid fa-trash text-xs"></i>
                                        </button>
                                    {% endif %}
                                </div>
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="4" class="px-5 py-8 text-center text-slate-400">
                                <i class="fa-regular fa-camera text-2xl block mb-2"></i>
                                Belum ada foto.
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% include 'core/base/pagination.html' with page_obj=photos %}
    </div>
</div>

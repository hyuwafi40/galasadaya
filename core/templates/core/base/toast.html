{% if messages %}
    <div id="toastContainer"
         class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 w-[90%] max-w-sm pointer-events-none">
        {% for message in messages %}
            <div class="toast-item glass-panel p-4 rounded-2xl flex items-start gap-3 shadow-2xl shadow-indigo-900/10 pointer-events-auto toast-hidden {% if message.tags == 'success' %}toast-success{% elif message.tags == 'error' %}toast-error{% elif message.tags == 'warning' %}toast-warning{% else %}toast-info{% endif %}">
                <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5 shadow-inner {% if message.tags == 'success' %}bg-emerald-100 text-emerald-600{% elif message.tags == 'error' %}bg-rose-100 text-rose-600{% elif message.tags == 'warning' %}bg-amber-100 text-amber-600{% else %}bg-sky-100 text-sky-600{% endif %}">
                    <i class="fa-solid {% if message.tags == 'success' %}fa-check{% elif message.tags == 'error' %}fa-xmark{% elif message.tags == 'warning' %}fa-triangle-exclamation{% else %}fa-circle-info{% endif %} text-sm"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-sm font-extrabold text-slate-800">{% if message.tags == 'success' %}Success{% elif message.tags == 'error' %}Error{% elif message.tags == 'warning' %}Warning{% else %}Info{% endif %}</h4>
                    <p class="text-xs font-medium text-slate-500 mt-1">{{ message }}</p>
                </div>
                <button class="close-toast text-slate-400 hover:text-slate-700 btn-press">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
